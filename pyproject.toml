[project]
name = "Sorting algorithms visualiser"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["icontract", "customtkinter", "pydantic", "pygame"]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff", "mypy", "pre-commit", "fawltydeps", "interrogate"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "customtkinter"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["src", "tests"]
pythonpath = ["src"]

[tool.interrogate]
fail-under = 80
ignore-init-method = true
ignore-magic = true
ignore-private = true
ignore-module = true
ignore-overloaded-functions = true
# TrackedArray's rejected list methods: one line that raises, named by the
# message it raises. See src/algorithms/README.md for why they are refused.
ignore-regex = ["append", "extend", "insert", "pop", "remove", "clear", "reverse"]
exclude = ["tests"]

[tool.fawltydeps]
code = ["src", "tests"]
deps = ["pyproject.toml"]
ignore_undeclared = [
    "algorithms",
    "configurator",
    "generator",
    "stats",
    "tracked_array",
    "tracked_integer",
]
ignore_unused = [
    "customtkinter",
    "black",
    "ruff",
    "mypy",
    "pre-commit",
    "fawltydeps",
    "interrogate",
]
